# Caddy as a reverse proxy in front of pycrocosm, with HTTPS certificates that
# it obtains and renews by itself. See README.md in this folder.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      UPSTREAM: ${UPSTREAM:-host.docker.internal:8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The project's static folder, which holds the planet dumps
      - ../static:/srv/pycrocosm/static:ro
      # Certificates and their keys: keep this volume, or they are requested afresh
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
